<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leda radio, prova microfono</title>
<style>
  body { font-family: sans-serif; background: #14161a; color: #e8e8e8; margin: 0; padding: 20px 16px; }
  h1 { font-size: 1.3em; margin: 0 0 12px; text-align: center; }
  button { display: block; width: 100%; max-width: 420px; margin: 10px auto; padding: 18px; font-size: 1.15em; border: 0; border-radius: 12px; background: #3b82f6; color: #fff; }
  button.secondary { background: #374151; font-size: 1em; padding: 12px; }
  #state { text-align: center; margin: 14px 0; font-size: 1.1em; }
  #text { background: #1f2937; border-radius: 10px; padding: 12px; min-height: 3em; margin: 12px 0; font-size: 1.05em; white-space: pre-wrap; }
  #log { font: .78em/1.4 monospace; color: #9ca3af; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<h1>Prova microfono con il tasto dell'auricolare (v11)</h1>
<button id="activate">Attiva</button>
<div id="state">Premi "Attiva" (chiede il permesso del microfono).</div>
<button id="manual" class="secondary" hidden>Avvia / ferma a mano</button>
<div id="devices"></div>
<button id="copy" class="secondary">Copia il registro (poi incollalo nella chat)</button>
<div id="text"></div>
<div id="log"></div>
<audio id="ka" src="silence-tone-30s.wav" loop></audio>

<script>
// MICROPHONE FEASIBILITY TEST (2026-11-14). Nothing is sent anywhere: audio and text stay in this page and are shown on screen.
// One earbud press ("pause" media action) toggles: 1st press = start listening, 2nd press = stop ("send": here only shown). Short beeps tell which.
// Modes (address): ?mode=sr (default) browser speech recognition (Italian); ?mode=rec records the audio (MediaRecorder) and shows its size.
const Q = new URLSearchParams(location.search);
const MODE = ['rec', 'probe'].includes(Q.get('mode')) ? Q.get('mode') : 'sr';   // v8: 'probe' = does the earbud tap arrive while the microphone is open?
// v11 (2026-11-21): Tommaso counted my beeps: after 5-6 double taps the page answered after the 2nd, 4th, 6th only (every SECOND gesture
// is lost, the earbud beeps every time). Hypothesis: the earbud (or the Android Bluetooth stack) keeps a play/pause state of its own and
// sends 'pause' while the phone says 'playing'; after our pause handler the next gesture becomes a 'play' that is dropped because the session
// is still 'playing'. So we keep the state the system sees IN STEP with the toggle. ?sync=toggle (default): 'pause' -> state 'paused',
// 'play' -> state 'playing' (the tone keeps playing, only the REPORTED state changes). ?sync=flap: after a 'pause' report 'paused' for 300 ms,
// then 'playing' again. ?sync=none: v10 behaviour (reference).
const SYNC = Q.get('sync') || 'toggle';
function syncState(act) {
  if (!('mediaSession' in navigator) || SYNC === 'none') return;
  const ms = navigator.mediaSession;
  if (SYNC === 'flap') { if (act === 'pause') { ms.playbackState = 'paused'; setTimeout(() => { ms.playbackState = 'playing'; }, 300); } return; }
  if (act === 'pause') ms.playbackState = 'paused'; else if (act === 'play') ms.playbackState = 'playing';
}
const KEEP = Q.get('keep') === '1';   // v7: keep the microphone OPEN from 'Attiva' (to test whether a stream opened while visible survives in the background)
const $ = (id) => document.getElementById(id);
const ka = $('ka'), logEl = $('log'), stateEl = $('state'), textEl = $('text');
const t0 = Date.now();
function log(m) { const s = ((Date.now() - t0) / 1000).toFixed(1).padStart(6) + ' s [' + document.visibilityState + '] ' + m; logEl.textContent = s + '\n' + logEl.textContent; }
let ac = null, stream = null, listening = false, active = false;
let rec = null, chunks = [], chunkLog = 0, recStart = 0;       // rec mode
let sr = null, finalText = '', interim = '', fatal = false;                  // sr mode

function beep(times) {                                         // audible feedback in the earbud (screen is usually off)
  if (!ac) return;
  for (let i = 0; i < times; i++) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = 880; g.gain.value = 0.25;
    o.connect(g); g.connect(ac.destination);
    const t = ac.currentTime + i * 0.25; o.start(t); o.stop(t + 0.12);
  }
}

async function start() {
  if (listening) return;
  listening = true; fatal = false; finalText = ''; interim = ''; textEl.textContent = '';
  stateEl.textContent = 'Registro... (premi di nuovo per fermare)';
  beep(1);
  log('START (' + MODE + ')');
  try {
    if (MODE === 'rec') {
      if (!stream) stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      const track = stream.getAudioTracks()[0];
      log('microfono usato: ' + (track && track.label) + ' state=' + (track && track.readyState) + ' muted=' + (track && track.muted));
      track.onmute = () => log('microfono MUTO dal browser'); track.onunmute = () => log('microfono di nuovo attivo');
      rec = new MediaRecorder(stream); chunks = []; chunkLog = 0; recStart = Date.now();
      rec.ondataavailable = (e) => { chunks.push(e.data); if (chunkLog++ < 5) log('chunk ' + e.data.size + ' byte'); };
      rec.start(1000);
    } else {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { log('riconoscimento vocale NON disponibile'); listening = false; return; }
      sr = new SR(); sr.lang = 'it-IT'; sr.continuous = true; sr.interimResults = true;
      sr.onstart = () => log('sr onstart');
      sr.onaudiostart = () => log('sr audiostart');
      sr.onresult = (e) => {
        interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const r = e.results[i];
          if (r.isFinal) finalText += r[0].transcript + ' '; else interim += r[0].transcript;
        }
        textEl.textContent = finalText + interim;
      };
      sr.onerror = (e) => { log('sr ERRORE ' + e.error); if (e.error === 'not-allowed' || e.error === 'network' || e.error === 'service-not-allowed') { fatal = true; } };
      sr.onend = () => { log('sr onend'); if (fatal) { log('sr FERMATO: errore fatale, niente riavvio'); listening = false; stateEl.textContent = 'Errore del riconoscimento (vedi registro).'; return; } if (listening) { try { sr.start(); log('sr riavviato'); } catch (x) { log('sr riavvio fallito ' + x.message); } } };
      sr.start();
    }
  } catch (e) { log('ERRORE start: ' + e.name + ' ' + e.message); listening = false; }
}

function stop() {
  if (!listening) return;
  listening = false;
  beep(2);
  stateEl.textContent = 'Fermato. Risultato qui sotto.';
  log('STOP');
  if (MODE === 'rec' && rec) {
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: rec.mimeType });
      log('registrazione: ' + blob.size + ' byte, ' + ((Date.now() - recStart) / 1000).toFixed(1) + ' s, tipo ' + rec.mimeType + ', chunk ' + chunks.length);
      if (!KEEP) { try { stream.getTracks().forEach((t) => t.stop()); stream = null; log('microfono rilasciato'); } catch (e) {} }
      textEl.textContent = 'Audio registrato: ' + blob.size + ' byte in ' + ((Date.now() - recStart) / 1000).toFixed(1) + ' s (' + chunks.length + ' pezzi).';
    };
    rec.stop();
  } else if (sr) {
    try { sr.stop(); } catch (e) {}
    setTimeout(() => { log('testo finale: "' + (finalText + interim).trim() + '"'); textEl.textContent = (finalText + interim).trim() || '(nessun testo riconosciuto)'; }, 1500);
  }
}
const toggle = () => (listening ? stop() : start());

// ---------------------------------------------------------------------------------------------------------------
// v8 PROBE MODE (?mode=probe), 2026-11-20. Question to settle: when the microphone is OPEN, do the earbud taps still reach the page?
// The v7 verdict ("with the microphone open nothing arrives") was weak, for three reasons:
//   1. a single trial;
//   2. in v7 the microphone was opened BEFORE the tone and the media session were started, and the result of the tone was never
//      looked at: if the tone had not started there was no active media player, so no taps could arrive, and the cause would be
//      the page, not the earbud;
//   3. it was not recorded which microphone was in use (the earbud's own or the phone's).
// Here: (a) tone + media session are started FIRST and their state is logged every 5 s; (b) the microphone is opened later, by hand,
// choosing the input from the list (earbud / phone / none = control); (c) EVERYTHING that reaches the page is logged: media actions,
// keyboard keys (media buttons can also arrive as keys), tone events, page lifecycle (hidden / freeze / resume); (d) taps are only
// counted and beeped, nothing is recorded: the goal is only to see whether they arrive.
let probeStream = null, probeTaps = 0;
function probeStatus() {                                       // one line on screen: taps received so far and which microphone is open
  const track = probeStream && probeStream.getAudioTracks()[0];
  stateEl.textContent = 'Tocchi ricevuti: ' + probeTaps + '  |  microfono: ' + (track ? track.label : 'CHIUSO');
}
function probeTap(what) { probeTaps++; log('TOCCO #' + probeTaps + ' = ' + what); beep(1); probeStatus(); }
function probeCloseMic() {
  if (!probeStream) return;
  probeStream.getTracks().forEach((t) => { t.onended = null; t.stop(); });
  probeStream = null; log('MICROFONO CHIUSO'); probeStatus();
}
let probeBusy = false;   // v9: v8 trial 2 showed several quick presses on 'Apri' racing each other (open / close / open / OverconstrainedError)
// v10: 'raw' = open the microphone WITHOUT echo cancellation, noise suppression and automatic gain. Hypothesis to test: with these
// on (the default) Chrome records through the Android 'voice communication' source, which puts the phone in communication mode and
// may change who receives the earbud button; with them off it should use the plain microphone source and leave the audio mode alone.
let probeRaw = false, probeOpenRaw = false;
async function probeOpenMic(deviceId, label) {
  if (probeBusy) { log('premuto mentre un\'apertura e\' in corso: IGNORATO'); return; }
  if (probeStream && probeStream.getAudioTracks()[0].label === label && probeOpenRaw === probeRaw) { log('quel microfono e\' GIA\' aperto cosi\': ignorato (ora fai i tocchi)'); return; }
  probeBusy = true;
  probeCloseMic();
  try {
    // v9: the deviceId of a Bluetooth input can change after the route switch (v8 trial 2: OverconstrainedError), so look it up again by label
    let id = deviceId;
    try { const now = (await navigator.mediaDevices.enumerateDevices()).find((d) => d.kind === 'audioinput' && d.label === label); if (now) id = now.deviceId; } catch (e) {}
    const audio = probeRaw ? { echoCancellation: false, noiseSuppression: false, autoGainControl: false } : {};
    if (id) audio.deviceId = { exact: id };
    probeStream = await navigator.mediaDevices.getUserMedia({ audio: Object.keys(audio).length ? audio : true });
    probeOpenRaw = probeRaw;
    const track = probeStream.getAudioTracks()[0];
    log('impostazioni reali del microfono: ' + JSON.stringify(track.getSettings()));   // shows what the browser really applied (echoCancellation etc.)
    track.onmute = () => log('microfono MUTO dal browser'); track.onunmute = () => log('microfono di nuovo attivo');
    track.onended = () => log('microfono TERMINATO dal sistema');
    log('MICROFONO APERTO: ' + track.label + ' (scelto: ' + label + ') state=' + track.readyState + ' muted=' + track.muted + '  --> ORA fai i tocchi');
  } catch (e) { log('microfono NON aperto: ' + e.name + ' ' + e.message); }
  probeBusy = false;
  probeStatus();
}
async function activateProbe() {
  stateEl.textContent = 'Attivazione in corso...';
  log('premuto Attiva (probe) sync=' + SYNC);
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); log('audio context: ' + ac.state); } catch (e) { log('ERRORE audio context: ' + e.name); }
  // 1. the tone FIRST (it is what makes Chrome treat the page as an active media player), and the result is logged
  try { await ka.play(); log('tono: AVVIATO'); } catch (e) { log('tono: ERRORE ' + e.name + ' ' + e.message); }
  // 2. the media session, with a handler for EVERY action (so that we see which one the earbud tap produces)
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: 'Prova tocchi', artist: 'Leda radio' });
    navigator.mediaSession.playbackState = 'playing';
    for (const act of ['play', 'pause', 'stop', 'previoustrack', 'nexttrack', 'seekbackward', 'seekforward', 'seekto']) {
      try { navigator.mediaSession.setActionHandler(act, () => { probeTap('azione ' + act); syncState(act); ka.play().catch(() => {}); }); } catch (e) { log('azione non supportata: ' + act); }
    }
  } else { log('mediaSession NON disponibile'); }
  // 3. everything else that could carry a tap or explain why none arrives
  document.addEventListener('keydown', (e) => probeTap('tasto tastiera ' + e.key + ' (' + e.code + ')'));
  for (const ev of ['play', 'pause', 'ended', 'stalled', 'waiting']) ka.addEventListener(ev, () => log('tono evento: ' + ev));
  for (const ev of ['freeze', 'resume']) document.addEventListener(ev, () => log('pagina evento: ' + ev));      // Page Lifecycle: Chrome freezing the page
  for (const ev of ['pagehide', 'pageshow']) window.addEventListener(ev, () => log('finestra evento: ' + ev));
  // 4. microphone permission once (released at once: the stream is opened later, by hand), then one button per audio input
  try { const s = await navigator.mediaDevices.getUserMedia({ audio: true }); s.getTracks().forEach((t) => t.stop()); log('permesso microfono OK (rilasciato)'); }
  catch (e) { log('permesso microfono NEGATO: ' + e.name + ' ' + e.message); }
  const inputs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'audioinput');
  log('ingressi audio: ' + inputs.map((d) => d.label || '(senza nome)').join(' | '));
  const box = $('devices'); box.textContent = '';
  const addButton = (text, fn) => { const b = document.createElement('button'); b.className = 'secondary'; b.textContent = text; b.addEventListener('click', fn); box.appendChild(b); return b; };
  const rawButton = addButton('Elaborazione audio: ATTIVA (premi per spegnerla)', () => {   // v10: switch echo/noise/gain processing off for the NEXT opens
    probeRaw = !probeRaw;
    rawButton.textContent = probeRaw ? 'Elaborazione audio: SPENTA (premi per riaccenderla)' : 'Elaborazione audio: ATTIVA (premi per spegnerla)';
    log('elaborazione audio ' + (probeRaw ? 'SPENTA' : 'ATTIVA') + ' per le prossime aperture (il microfono aperto va riaperto)');
  });
  addButton('Nessun microfono (controllo)', probeCloseMic);
  inputs.forEach((d, i) => addButton('Apri: ' + (d.label || 'ingresso ' + (i + 1)), () => probeOpenMic(d.deviceId, d.label)));
  // 5. a heartbeat every 5 s: if the log shows gaps, the page was frozen; it also shows whether the tone and the session stayed alive
  setInterval(() => {
    const track = probeStream && probeStream.getAudioTracks()[0];
    log('cuore: tono=' + (ka.paused ? 'FERMO' : 'in corso') + ' t=' + ka.currentTime.toFixed(1) + ' sessione=' + (navigator.mediaSession && navigator.mediaSession.playbackState) +
        ' mic=' + (track ? track.readyState + (track.muted ? ' MUTO' : '') : 'chiuso') + ' tocchi=' + probeTaps);
  }, 5000);
  active = true;
  $('activate').hidden = true;
  probeStatus();
}

$('activate').addEventListener('click', async () => {
  if (MODE === 'probe') { await activateProbe(); return; }
  // v4: immediate visible feedback (v3 gave none while the microphone permission was pending, so the page looked frozen)
  stateEl.textContent = 'Attivazione in corso... (se compare la richiesta del microfono, consenti)';
  log('premuto Attiva sync=' + SYNC + (KEEP ? ' keep=1' : ''));
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); log('audio context: ' + ac.state); } catch (e) { log('ERRORE audio context: ' + e.name + ' ' + e.message); }
  // v5: diagnostics. State of the microphone permission, number of audio inputs, and a timer that says so if the browser never answers.
  try { const ps = await navigator.permissions.query({ name: 'microphone' }); log('stato permesso microfono: ' + ps.state); } catch (e) { log('stato permesso non leggibile: ' + e.name); }
  try { const dv = await navigator.mediaDevices.enumerateDevices(); log('ingressi audio visti: ' + dv.filter((d) => d.kind === 'audioinput').length); } catch (e) { log('elenco dispositivi ERRORE: ' + e.name); }
  log('chiedo il microfono (getUserMedia)...');
  const waitTimer = setTimeout(() => { log('ATTENZIONE: il browser non risponde da 8 s alla richiesta del microfono'); stateEl.textContent = 'Il browser non risponde alla richiesta del microfono (vedi registro).'; }, 8000);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    clearTimeout(waitTimer);
    const track = stream.getAudioTracks()[0];
    log('permesso microfono OK: ' + (track && track.label));
    if (KEEP && MODE === 'rec') { log('microfono TENUTO APERTO (keep=1)'); stream.getAudioTracks()[0].onmute = () => log('microfono MUTO dal browser'); }
    else { stream.getTracks().forEach((t) => t.stop()); stream = null; log('microfono rilasciato (si riapre solo al tocco)'); }   // v6: rec reopens it in start()
  } catch (e) { clearTimeout(waitTimer); log('permesso microfono NEGATO: ' + e.name + ' ' + e.message); }
  ka.play().then(() => log('tono OK'), (e) => log('tono ERRORE ' + e.name));
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: 'Prova microfono', artist: 'Leda radio' });
    navigator.mediaSession.playbackState = 'playing';
    navigator.mediaSession.setActionHandler('play',  () => { log('tasto: play');  syncState('play');  toggle(); ka.play().catch(() => {}); });
    navigator.mediaSession.setActionHandler('pause', () => { log('tasto: pause'); syncState('pause'); toggle(); ka.play().catch(() => {}); });
    for (const act of ['nexttrack', 'previoustrack', 'stop']) {
      try { navigator.mediaSession.setActionHandler(act, () => { log('tasto: ' + act); toggle(); }); } catch (e) { log('azione non supportata: ' + act); }
    }
  }
  active = true;
  $('activate').hidden = true; $('manual').hidden = false;
  stateEl.textContent = 'Pronto (' + MODE + '). Premi il tasto dell\'auricolare una volta per iniziare, di nuovo per fermare.';
});
$('manual').addEventListener('click', toggle);
$('copy').addEventListener('click', async () => {
  const txt = 'MODE=' + MODE + '\n' + logEl.textContent.split('\n').reverse().join('\n') + '\nTESTO: ' + textEl.textContent;
  try { await navigator.clipboard.writeText(txt); stateEl.textContent = 'Registro copiato: incollalo nella chat.'; } catch (e) { stateEl.textContent = 'Copia non riuscita: ' + e.message; }
});
document.addEventListener('visibilitychange', () => log('visibilita: ' + document.visibilityState));
ka.addEventListener('pause', () => { if (active) ka.play().catch(() => {}); });
</script>
</body>
</html>
